spring.application.name=Fixpoint
app.env=${APP_ENV:${SPRING_PROFILES_ACTIVE:dev}}

security.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
logging.level.org.springframework.security=${LOG_SECURITY_LEVEL:INFO}

spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/fixpoint}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:adminpostgresql}
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.create-schemas=true
spring.flyway.placeholders.APP_TIMEZONE=${APP_TIMEZONE:America/Argentina/Buenos_Aires}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fixpoint}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:adminpostgresql}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=${FILE_UPLOAD_DIR:uploads}
app.file.storage-limit-bytes=${FILE_STORAGE_LIMIT_BYTES:0}
app.timezone=${APP_TIMEZONE:America/Argentina/Buenos_Aires}

security.jwt.secret=${JWT_SECRET:fixpoint-dev-jwt-secret-change-me-2026}
security.jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}

security.auth.refresh.expiration-seconds=${AUTH_REFRESH_EXPIRATION_SECONDS:43200}
security.auth.refresh.remember-expiration-seconds=${AUTH_REFRESH_REMEMBER_EXPIRATION_SECONDS:2592000}
security.auth.refresh.cookie.name=${AUTH_REFRESH_COOKIE_NAME:fixpoint_refresh_token}
security.auth.refresh.cookie.path=${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
security.auth.refresh.cookie.same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
security.auth.refresh.cookie.secure=${AUTH_REFRESH_COOKIE_SECURE:false}
security.auth.refresh.cookie.domain=${AUTH_REFRESH_COOKIE_DOMAIN:}
