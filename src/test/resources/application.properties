spring.datasource.url=jdbc:h2:mem:fixpoint;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false

security.cors.allowedOrigins=http://localhost:4200
app.timezone=America/Argentina/Buenos_Aires
app.file.upload-dir=target/test-uploads
security.jwt.secret=test-jwt-secret-key-with-at-least-32-characters
security.jwt.access-expiration-seconds=43200
app.env.validation.enabled=false
